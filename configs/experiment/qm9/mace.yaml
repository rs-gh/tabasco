# @package _global_
defaults:
  - /experiment/qm9/baseline

tags: ["qm9", "repa", "mace"]

model:
  repa_loss:
    _target_: tabasco.models.components.losses.REPALoss
    lambda_repa: 0.5
    combination_mode: additive
    similarity_type: cosine
    time_weighting: false
    encoder:
      _target_: tabasco.models.components.encoders.MACEEncoder
      model_name: small  # small, medium, or large
      invariants_only: true
      num_layers: -1  # -1 for all layers
      dataset_normalizer: 2.0
    projector:
      _target_: tabasco.models.components.encoders.Projector
      hidden_dim: ${model.net.hidden_dim}
      encoder_dim: 192  # MACE small: 96 features/layer x 2 layers

logger:
  wandb:
    name: "${now:%m%d-%H%M}-tabasco-qm9-mace"
