[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tabasco"
version = "0.1"
dependencies = [
    "numpy>=1.23.5,<2.0",
    "rdkit>=2024.3.1",
    "scipy>=1.11.0",
    "torch>=2.1.0",
    "tqdm>=4.66.4",
    "lightning>=2.0",
    "torchmetrics>=0.11",
    "hydra-core>=1.3",
    "rich>=13.0",
    "datamol>=0.12",
    "hydra-optuna-sweeper>=1.2",
    "hydra-colorlog>=1.2",
    "rootutils>=1.0",
    "biotite>=1.0,<2.0",
    "lmdb>=1.0,<2.0",
    "tensordict>=0.7.0",
    "plotly>=6.0.0",
    "wandb>=0.17.0",
    "pymol-remote>=1.1.0",
    "posebusters>=0.3.1",
    "py3Dmol>=2.4.2",
    "posecheck>=1.3.1",
    "huggingface-hub>=1.3.2",
    "openbabel-wheel>=3.1.1.22",
    "chemprop>=2.2.2",
    "mace-torch>=0.3.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["tabasco", "tabasco.chem", "tabasco.models", "tabasco.utils"]

[tool.pytest.ini_options]
addopts = [
  "--color=yes",
  "--durations=0",
  "--strict-markers",
  "--doctest-modules",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
log_cli = "True"
markers = [
  "slow: slow tests",
]
minversion = "6.0"
testpaths = "tests/"

[tool.coverage.report]
exclude_lines = [
    "pragma: nocover",
    "raise NotImplementedError",
    "raise NotImplementedError()",
    "if __name__ == .__main__.:",
]

[project.scripts]
train_command = "src.train:main"
eval_command  = "src.eval:main"
